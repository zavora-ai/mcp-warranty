server_id = "mcp_warranty"
display_name = "Warranty Management"
version = "1.0.0"
domain = "warranty"
sdk_version = "0.1.0"
risk_level = "high"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []
governance_gates = []
environments = ["development", "staging", "production"]

[[tools]]
name = "create_product"
description = "Create a product in the catalog"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_product"
description = "Get a product by id"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_products"
description = "List products by category"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_plan"
description = "Create a warranty plan with coverage terms"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_plan"
description = "Get a warranty plan"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_plans"
description = "List warranty plans"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "register"
description = "Register a unit under a plan (computes coverage window)"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_registration"
description = "Get a registration by id or serial"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_registrations"
description = "List registrations by owner/status"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "transfer_registration"
description = "Transfer a registration to a new owner (if transferable)"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "check_entitlement"
description = "Check coverage/entitlement for a registration"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "submit_claim"
description = "File a warranty claim"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_claim"
description = "Get a claim by id"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_claims"
description = "List claims by registration/status"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "triage_claim"
description = "Move a submitted claim to triaged"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "validate_claim"
description = "Validate coverage without changing the claim (read-only)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "approve_claim"
description = "Approve a claim and set payout — gated (financial)"
risk_class = "external_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "reject_claim"
description = "Reject a claim with a reason — gated (contractual)"
risk_class = "external_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "close_claim"
description = "Close a claim (terminal)"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "issue_rma"
description = "Issue an RMA for an approved claim — gated (remedy)"
risk_class = "external_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "update_rma_status"
description = "Update an RMA's status"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_rma"
description = "Get an RMA by id"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "claims_analytics"
description = "Claims analytics: status mix, approval rate, payouts"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "audit_log"
description = "Recent audit-trail entries"
risk_class = "read_only"
requires_approval = false
credential_bindings = []
