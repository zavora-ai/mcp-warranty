<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#b45309"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="780" height="470" fill="#f8fafc" rx="12"/>
  <rect x="265" y="10" width="250" height="28" rx="8" fill="url(#hg)"/>
  <text x="390" y="29" text-anchor="middle" fill="white" font-size="12" font-weight="bold">mcp-warranty — Warranty Management</text>

  <!-- agents -->
  <rect x="40" y="48" width="700" height="42" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="390" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">Warranty Agents (clients of the warranty platform)</text>
  <text x="390" y="79" text-anchor="middle" font-size="7" fill="#b45309">Claim Intake · Claim Adjudication · Coverage / Warranty Analytics</text>
  <line x1="390" y1="90" x2="390" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- tools -->
  <rect x="30" y="110" width="720" height="104" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <rect x="30" y="110" width="720" height="22" rx="10" fill="url(#hg)"/>
  <text x="390" y="125" text-anchor="middle" fill="white" font-size="10" font-weight="bold">24 Tools — warranty platform</text>
  <g font-size="7.2" font-weight="bold" fill="#92400e" text-anchor="middle">
    <text x="120" y="150">Products/Plans (6)</text>
    <text x="320" y="150">Registrations (5)</text>
    <text x="520" y="150">Claims (8)</text>
    <text x="680" y="150">RMA/Analytics (5)</text>
  </g>
  <g font-size="6.2" fill="#6b21a8" text-anchor="middle">
    <text x="120" y="165">product · plan</text>
    <text x="120" y="176">(coverage terms)</text>
    <text x="320" y="165">register · transfer</text>
    <text x="320" y="176">check_entitlement</text>
    <text x="520" y="165">submit · triage · validate</text>
    <text x="520" y="176">approve*† · reject*† · close</text>
    <text x="680" y="165">issue_rma*†</text>
    <text x="680" y="176">analytics · audit</text>
  </g>
  <text x="390" y="198" text-anchor="middle" font-size="6.4" fill="#64748b">* requires approval   † external write — financial / contractual / remedy</text>
  <line x1="390" y1="214" x2="390" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- engines -->
  <rect x="30" y="234" width="720" height="92" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="249" text-anchor="middle" font-size="9" font-weight="bold" fill="#6b21a8">Domain engines</text>
  <g font-size="6.8" fill="#581c87" text-anchor="middle">
    <text x="125" y="269" font-weight="bold">Coverage window</text>
    <text x="125" y="281">purchase + duration</text>
    <text x="125" y="292">(month-accurate)</text>
    <text x="315" y="269" font-weight="bold">Entitlement</text>
    <text x="315" y="281">window · covered ·</text>
    <text x="315" y="292">exclusion · cap</text>
    <text x="510" y="269" font-weight="bold">Adjudication</text>
    <text x="510" y="281">re-validate → payable</text>
    <text x="510" y="292">(deductible, cap)</text>
    <text x="680" y="269" font-weight="bold">RMA flow</text>
    <text x="680" y="281">approved → repair</text>
    <text x="680" y="292">→ close claim</text>
  </g>
  <line x1="390" y1="326" x2="390" y2="342" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- store -->
  <rect x="30" y="346" width="720" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="390" y="362" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">In-memory store (thread-safe) + audit trail</text>
  <g font-size="6.6" fill="#475569" text-anchor="middle">
    <text x="390" y="379">products · plans · registrations · claims · rmas</text>
    <text x="390" y="392" fill="#64748b">PRD · PLN · REG · CLM · RMA</text>
  </g>

  <text x="390" y="430" text-anchor="middle" font-size="8" fill="#7c3aed" font-weight="bold">adk-mcp-sdk · rmcp 1.7 · stdio transport · registry-ready manifest</text>
  <text x="390" y="448" text-anchor="middle" font-size="7" fill="#94a3b8">Apache-2.0 · zavora-ai/mcp-warranty</text>
</svg>
